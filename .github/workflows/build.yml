name: Build Autonomic EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies and PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download yt-dlp.exe and FFmpeg
      shell: pwsh
      run: |
        Write-Host "Downloading yt-dlp..."
        Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "yt-dlp.exe"

        Write-Host "Downloading FFmpeg..."
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"

        Write-Host "Extracting FFmpeg..."
        Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
        
        $ffmpegPath = (Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse).FullName
        Copy-Item -Path $ffmpegPath -Destination "."

        Write-Host "Cleaning up temp files..."
        Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg_extracted"

    - name: Build All-in-One EXE with PyInstaller
      run: |
        pyinstaller --onefile --name="MediaDownloader" --add-binary "yt-dlp.exe;." --add-binary "ffmpeg.exe;." downloader.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-Standalone
        path: dist/MediaDownloader.exe
